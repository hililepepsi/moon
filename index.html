<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Banana Base — Site Layout</title>
<style>
  :root{
    --space-black:#0a0c12;
    --space-black-2:#12141d;
    --moon-gray:#c7c5bd;
    --moon-gray-dim:#8a887f;
    --banana:#f2c14e;
    --crater-line:#2a2d3a;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--space-black); font-family:'Courier New', monospace; color:var(--moon-gray); }
  #scene-canvas{ position:fixed; inset:0; display:block; }

  #panel{
    position:fixed; top:20px; left:20px;
    background:rgba(18,20,29,0.85);
    border:1px solid var(--crater-line);
    border-radius:10px;
    padding:14px 16px;
    max-width:300px;
    backdrop-filter: blur(4px);
    z-index:10;
    line-height:1.6;
  }
  #panel h1{ font-size:13px; letter-spacing:0.08em; margin:0 0 8px; color:var(--banana); font-weight:700; text-transform:uppercase; }
  #panel .line{ font-size:11px; color:var(--moon-gray-dim); }
  #panel .line b{ color:var(--moon-gray); }
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--space-black); color:var(--moon-gray-dim); font-size:12px; letter-spacing:0.08em;
    z-index:50; transition:opacity .4s ease;
  }

  /* ---- 永続レイヤー: YouTube小窓(ルート切替の影響を受けない) ---- */
  #yt-window{
    position:fixed; bottom:26px; right:26px;
    width:220px;
    background:var(--space-black-2);
    border:1px solid var(--crater-line);
    border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6);
    overflow:hidden;
    opacity:0; transform:translateY(16px) scale(0.96);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    z-index:100;
  }
  #yt-window.visible{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  #yt-window-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; background:var(--space-black);
    font-size:10px; color:var(--moon-gray-dim); letter-spacing:0.06em;
    border-bottom:1px solid var(--crater-line);
  }
  #yt-window-head span.dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--banana); margin-right:6px; }
  #yt-close{ background:none; border:none; color:var(--moon-gray-dim); cursor:pointer; font-size:13px; line-height:1; padding:0 2px; }
  #yt-close:hover{ color:var(--banana); }
  #yt-player-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:#000; }
  #yt-player-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none; }
  /* ↑ iframeへのクリックを禁止し、フォーカスが奪われてWASDが効かなくなる問題を回避。
     操作はレコードのクリック/閉じるボタンなど自作UI経由に統一する。 */

  /* ---- ルート: レコード詳細(オーバーレイ。ページ遷移ではなくDOM切替) ---- */
  #record-route{
    position:fixed; inset:0; z-index:40;
    background:rgba(10,12,18,0.92);
    backdrop-filter: blur(6px);
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:18px;
  }
  #record-route.active{ display:flex; }
  #record-route h2{ color:var(--banana); font-size:16px; letter-spacing:0.1em; margin:0; }
  #record-route p{ color:var(--moon-gray-dim); font-size:12px; max-width:320px; text-align:center; line-height:1.7; }
  #record-list{ display:flex; flex-direction:column; gap:8px; width:260px; }
  .jukebox-item{
    background:var(--space-black-2); border:1px solid var(--crater-line); color:var(--moon-gray);
    border-radius:8px; padding:10px 14px; font-family:inherit; font-size:13px; text-align:left;
    cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    transition: border-color .2s ease, background .2s ease;
  }
  .jukebox-item:hover{ border-color:var(--banana); }
  .jukebox-item.active{ background:rgba(242,193,78,0.12); border-color:var(--banana); color:var(--banana); }
  .jukebox-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--banana); opacity:0; }
  .jukebox-item.active .dot{ opacity:1; }
  #back-to-crater{
    background:var(--banana); color:#241a06; border:none; border-radius:6px;
    padding:9px 18px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  #back-to-crater:hover{ background:#ffd873; }

  /* ---- ルート: 月オーバーレイ(Mキーで全体像を表示するモーダル) ---- */
  #moon-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(10,12,18,0.92);
    backdrop-filter: blur(6px);
    display:none;
  }
  #moon-overlay.active{ display:block; }
  #moon-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>

<div id="loading">LOADING BASE MODEL...</div>
<canvas id="scene-canvas"></canvas>

<div id="panel">
  <h1>Moon Banana Base — Site Layout</h1>
  <div class="line">敷地半径: <b id="pad-radius"></b> world units</div>
  <div class="line">基地モデル倍率: <b id="model-scale"></b></div>
  <div class="line">ドラッグで視点回転・スクロールでズーム</div>
  <div class="line"><b>Gキー</b>で地上モード切替(WASDで移動)</div>
  <div class="line"><b>Spaceキー</b>でジャンプ(月重力)</div>
  <div class="line">モード: <b id="mode-label">俯瞰モード</b></div>
</div>

<!-- 永続レイヤー: どのルートにいても消えないYouTube小窓 -->
<div id="yt-window">
  <div id="yt-window-head">
    <span><span class="dot"></span>NOW PLAYING</span>
    <button id="yt-close">×</button>
  </div>
  <div id="yt-player-wrap">
    <iframe id="yt-iframe"
      src="https://www.youtube.com/embed/m0BFZkPsoWY?enablejsapi=1&playsinline=1&rel=0"
      allow="autoplay; encrypted-media"
      allowfullscreen></iframe>
  </div>
</div>

<!-- ルート: レコード詳細(実際のページ遷移ではなくオーバーレイ表示) -->
<div id="record-route">
  <h2>♪ MOON BANANA JUKEBOX</h2>
  <p>好きな曲を選んでください。右下の小窓は「月面(クレーター地上)」に戻っても再生を続けます。</p>
  <div id="record-list"></div>
  <button id="back-to-crater">← クレーター地上に戻る</button>
</div>

<!-- ルート: 月オーバーレイ(Mキーで表示/非表示。パネルなし、月本体のみ) -->
<div id="moon-overlay">
  <canvas id="moon-canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script>
/* =========================================================
   基本セットアップ
   ========================================================= */
const canvas = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; // 映画的な階調(白飛び/黒つぶれを自然に)
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔らかい影(硬い影は安っぽく見えるため)

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.FogExp2(0x0a0c12, 0.028); // 境界を霧でなじませる

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(14, 10, 16);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 30;          // 遠すぎて地形の端(未整備)が見えるのを防止
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ---------------------------------------------------------
   環境マップ: 公式サンプル(webgl_loader_gltf)と同じ手法。
   実写HDRIをRGBELoaderで読み込み、PMREMGenerator.fromEquirectangular()で変換する。
   (前回壊れたのはfromScene=3Dシーンをその場で撮影する処理。
    こちらはfromEquirectangular=静止画を変換する処理で、定番かつ安定した手法)
   --------------------------------------------------------- */
function buildSimpleEnvironment(){
  // HDRIの読み込みが終わるまでの仮の環境(グラデーション)
  const canvasEl = document.createElement('canvas');
  canvasEl.width = 256; canvasEl.height = 256;
  const ctx = canvasEl.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#dfe4ec');
  grad.addColorStop(0.55, '#8b8d94');
  grad.addColorStop(1, '#1c1d22');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(canvasEl);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
scene.environment = buildSimpleEnvironment(); // 仮の環境(HDRI読み込み完了後に差し替わる)

const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

new THREE.RGBELoader()
  .setDataType(THREE.UnsignedByteType)
  .load(
    // ローカルに置いた環境HDRI(暗め・星空系がおすすめ。Poly Havenの「Night」カテゴリ等)
    './environment.hdr',
    (hdrTexture) => {
      const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
      scene.environment = envMap;
      hdrTexture.dispose();
      pmremGenerator.dispose();
    },
    undefined,
    (err) => {
      console.error('HDRI読み込みエラー(仮のグラデーション環境のまま続行します):', err);
    }
  );

// ライティング
scene.add(new THREE.AmbientLight(0x445066, 0.5));
const key = new THREE.DirectionalLight(0xfff2cf, 1.4);
key.position.set(8, 12, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20; key.shadow.camera.right = 20;
key.shadow.camera.top = 20; key.shadow.camera.bottom = -20;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.PointLight(0xf2c14e, 0.5, 20);
rim.position.set(-6, 4, -4);
scene.add(rim);

// 星空
{
  const starGeo = new THREE.BufferGeometry();
  const count = 1000;
  const positions = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = 40 + Math.random()*50;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = Math.abs(r*Math.cos(phi))*0.6 + 3;
    positions[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.07, transparent:true, opacity:0.85 })));
}

/* =========================================================
   地形プレースホルダー(本番のクレーターDEMに差し替え予定)
   ========================================================= */
const WORLD_SIZE = 40; // 歩ける範囲・ビルドパッド判定の基準(ゲームプレイ上の値。変更しない)
const TERRAIN_EXTENT = WORLD_SIZE * 2; // 見た目の地形範囲(俯瞰時の「四方の切れ目」を遠くへ追いやるための拡張)
const BUILD_PAD_RADIUS = Math.sqrt((WORLD_SIZE ** 2 / 8) / Math.PI);

// 敷地(ビルドパッド)の可視化リング(先に作っておき、地形完成後に高さだけ合わせる)
const padRingGeo = new THREE.RingGeometry(BUILD_PAD_RADIUS - 0.06, BUILD_PAD_RADIUS, 96);
const padRingMat = new THREE.MeshBasicMaterial({ color:0xf2c14e, transparent:true, opacity:0.4, side:THREE.DoubleSide });
const padRing = new THREE.Mesh(padRingGeo, padRingMat);
padRing.rotation.x = -Math.PI/2;
padRing.position.y = 0.015;
scene.add(padRing);

document.getElementById('pad-radius').textContent = BUILD_PAD_RADIUS.toFixed(2);

function isWithinBuildPad(x, z){
  return Math.sqrt(x*x + z*z) <= BUILD_PAD_RADIUS;
}

/* ---------------------------------------------------------
   地形構築: displacementMapはGPU側のみでRaycasterに反映されないため、
   ハイトマップの画素値をCPU側で読み取り、ジオメトリの頂点自体を変形する。
   同じサンプリング関数を getTerrainHeightAt() でも使うので、
   見た目と当たり判定が必ず一致する。
   --------------------------------------------------------- */
const TERRAIN_SEGMENTS = 512; // TERRAIN_EXTENTを2倍にした分、歩行範囲の解像度を維持するため256→512に
const DISPLACEMENT_SCALE = 2; // 前回確認した値。地形が破綻したら調整

let ground = null;
let terrainSample = null; // { data, w, h } を保持
const pendingOnTerrainReady = [];

function sampleHeightBilinear(u, v){
  if (!terrainSample) return 0;
  const { data, w, h } = terrainSample;
  const uu = Math.min(Math.max(u, 0), 1);
  const vv = 1 - Math.min(Math.max(v, 0), 1); // PlaneGeometryのUV(v=0が下/v=1が上)とPNGの行順(上から0行目)の向きを合わせる
  const x = uu * (w - 1);
  const y = vv * (h - 1);
  const x0 = Math.floor(x), x1 = Math.min(x0 + 1, w - 1);
  const y0 = Math.floor(y), y1 = Math.min(y0 + 1, h - 1);
  const fx = x - x0, fy = y - y0;
  const get = (xx, yy) => data[(yy * w + xx) * 4]; // グレースケールPNGはR=G=B想定なのでRチャンネルのみ使用
  const top = get(x0, y0) * (1 - fx) + get(x1, y0) * fx;
  const bottom = get(x0, y1) * (1 - fx) + get(x1, y1) * fx;
  return (top * (1 - fy) + bottom * fy) / 255; // 0-1に正規化
}

// world座標 → PlaneGeometryのUVへの変換(下のbuildTerrainでの頂点配置と対応させる)
// TERRAIN_EXTENT基準(見た目の地形サイズ)。ハイトマップ・アルベド画像は
// どちらもこのTERRAIN_EXTENT全体をカバーする前提(中央にWORLD_SIZE分の高精細データを想定)
function worldToUV(x, z){
  return { u: (x / TERRAIN_EXTENT) + 0.5, v: 0.5 - (z / TERRAIN_EXTENT) };
}

function getTerrainHeightAt(x, z){
  if (!terrainSample) return 0;
  const { u, v } = worldToUV(x, z);
  return sampleHeightBilinear(u, v) * DISPLACEMENT_SCALE;
}

function buildTerrain(heightImg, albedoTexture){
  const w = heightImg.width, h = heightImg.height;
  const cvs = document.createElement('canvas');
  cvs.width = w; cvs.height = h;
  const cctx = cvs.getContext('2d');
  cctx.drawImage(heightImg, 0, 0);
  terrainSample = { data: cctx.getImageData(0, 0, w, h).data, w, h };

  const geo = new THREE.PlaneGeometry(TERRAIN_EXTENT, TERRAIN_EXTENT, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
  const uvAttr = geo.attributes.uv;
  const posAttr = geo.attributes.position;
  for (let i = 0; i < posAttr.count; i++){
    const u = uvAttr.getX(i);
    const v = uvAttr.getY(i);
    posAttr.setZ(i, sampleHeightBilinear(u, v) * DISPLACEMENT_SCALE); // 回転後、このローカルZが世界のYになる
  }
  posAttr.needsUpdate = true;
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    map: albedoTexture,
    roughness: 0.97,
    metalness: 0.03,
  });

  ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 敷地リングの高さを地形(ほぼ平坦のはず)に合わせる
  padRing.position.y = getTerrainHeightAt(0, 0) + 0.02;

  // ※「実シーンを環境マップとして焼き直す」処理は白飛びの原因になったため一旦撤回。
  //   scene.environmentは起動時に生成した仮のスタジオ環境マップのまま維持する。

  pendingOnTerrainReady.forEach(fn => fn());
  pendingOnTerrainReady.length = 0;
}

// --- 読み込み: ハイトマップ(画素アクセスのため素のImageで) + 月面画像(GPUテクスチャ) ---
const textureLoader = new THREE.TextureLoader();
let albedoTextureLoaded = null;
let heightImgLoaded = null;

function tryBuildTerrain(){
  if (albedoTextureLoaded && heightImgLoaded) {
    buildTerrain(heightImgLoaded, albedoTextureLoaded);
  }
}

// --- 月面画像(アルベド)の周囲を拡張 ---
// 新しい高精細画像は用意せず、既存のschrodinger_albedo.pngから
// 最頻色(≒地の色)を求めてベタ塗りし、中央に元画像を実際の敷地比率で
// 配置することで、追加のダウンロード容量ゼロのまま見た目の範囲だけ広げる。
function computeModeColor(img){
  const sampleSize = 128; // ヒストグラム集計用に縮小(処理を軽くするため)
  const cv = document.createElement('canvas');
  cv.width = sampleSize; cv.height = sampleSize;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, sampleSize, sampleSize);
  const data = ctx.getImageData(0, 0, sampleSize, sampleSize).data;

  const BUCKET = 16; // 256階調を16段階に量子化してヒストグラム化
  const counts = new Map();
  for (let i = 0; i < data.length; i += 4){
    const r = data[i] >> 4, g = data[i+1] >> 4, b = data[i+2] >> 4;
    const key = (r << 8) | (g << 4) | b;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  let bestKey = 0, bestCount = -1;
  counts.forEach((count, key) => { if (count > bestCount){ bestCount = count; bestKey = key; } });
  const r = ((bestKey >> 8) & 0xF) * BUCKET + BUCKET / 2;
  const g = ((bestKey >> 4) & 0xF) * BUCKET + BUCKET / 2;
  const b = (bestKey & 0xF) * BUCKET + BUCKET / 2;
  return `rgb(${r},${g},${b})`;
}

function buildExtendedAlbedoTexture(img){
  const CANVAS_SIZE = 2048; // 拡張分は単色なのでこの解像度で十分(元画像より大きくしない=メモリを抑える)
  const cv = document.createElement('canvas');
  cv.width = CANVAS_SIZE; cv.height = CANVAS_SIZE;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = computeModeColor(img);
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // 中央に元画像を、実際の敷地サイズの比率(WORLD_SIZE/TERRAIN_EXTENT)で配置
  const innerRatio = WORLD_SIZE / TERRAIN_EXTENT; // 例: 40/80 = 0.5
  const innerSize = CANVAS_SIZE * innerRatio;
  const offset = (CANVAS_SIZE - innerSize) / 2;
  ctx.drawImage(img, offset, offset, innerSize, innerSize);

  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

textureLoader.load('./schrodinger_albedo.png', (tex) => {
  albedoTextureLoaded = buildExtendedAlbedoTexture(tex.image);
  tryBuildTerrain();
}, undefined, (err) => console.error('月面画像の読み込みエラー:', err));

const heightImgEl = new Image();
heightImgEl.onload = () => { heightImgLoaded = heightImgEl; tryBuildTerrain(); };
heightImgEl.onerror = (err) => console.error('ハイトマップの読み込みエラー:', err);
heightImgEl.src = './schrodinger_heightmap_padded.png';

/* =========================================================
   基地モデル(banana-base.glb)の読み込みと配置
   ========================================================= */
// pygltflibでの解析結果(メッシュのローカルbbox × ノードのtranslation/scaleを反映済み。差し替え時は要再計測)
const MODEL_BOUNDS = {
  min: [-6.276481512069702, -0.02561154961585999, -5.357624340256799],
  max: [5.938730429401755, 7.071377098590136, 8.189352572704883],
};
const modelSize = MODEL_BOUNDS.max.map((v,i) => v - MODEL_BOUNDS.min[i]);
const modelMaxDim = Math.max(modelSize[0], modelSize[2]); // 横幅・奥行きの大きい方を基準にする

const TARGET_FOOTPRINT = (BUILD_PAD_RADIUS * 2) / 10; // 敷地(直径)の1/10
const MODEL_SCALE = TARGET_FOOTPRINT / modelMaxDim;
document.getElementById('model-scale').textContent = MODEL_SCALE.toFixed(4);

// 配置データ(位置は仮。敷地内であればOK)
const BASE_PLACEMENT = { x: 2.2, z: -1.5, rotationY: 0.5 };

if (!isWithinBuildPad(BASE_PLACEMENT.x, BASE_PLACEMENT.z)) {
  console.warn('基地の配置座標が敷地範囲外です:', BASE_PLACEMENT);
}

const loader = new THREE.GLTFLoader();
let gltfModelScene = null;

function placeBaseModel(){
  const inner = gltfModelScene;

  // モデルのローカル中心(x,z)と底面(y)を原点に合わせる
  const centerX = (MODEL_BOUNDS.min[0] + MODEL_BOUNDS.max[0]) / 2;
  const centerZ = (MODEL_BOUNDS.min[2] + MODEL_BOUNDS.max[2]) / 2;
  const bottomY = MODEL_BOUNDS.min[1];
  inner.position.set(-centerX, -bottomY, -centerZ);

  const wrapper = new THREE.Group();
  wrapper.add(inner);
  wrapper.scale.setScalar(MODEL_SCALE);
  inner.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  const groundY = getTerrainHeightAt(BASE_PLACEMENT.x, BASE_PLACEMENT.z); // 地形完成後なので正しい高さが取れる
  wrapper.position.set(BASE_PLACEMENT.x, groundY, BASE_PLACEMENT.z);
  wrapper.rotation.y = BASE_PLACEMENT.rotationY;

  scene.add(wrapper);

  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 400);
}

/* =========================================================

   ========================================================= */
// pygltflibでノード変形(translation/rotation/scale)を反映して算出したワールドbbox
const CROWN_BOUNDS = {
  min: [-7.79530671, -0.8506031, -7.91554713],
  max: [7.81189022, 11.63974465, 7.49542997],
};
const crownSize = CROWN_BOUNDS.max.map((v,i) => v - CROWN_BOUNDS.min[i]);
const crownMaxDim = Math.max(crownSize[0], crownSize[2]);

// 敷地に対してごく控えめな「置物」サイズ(基地よりだいぶ小さく)
const CROWN_TARGET_FOOTPRINT = (BUILD_PAD_RADIUS * 2) / 40;
const CROWN_SCALE = CROWN_TARGET_FOOTPRINT / crownMaxDim;
const CROWN_PLACEMENT = { x: -3.2, z: -2.0, rotationY: 0.8 };

if (!isWithinBuildPad(CROWN_PLACEMENT.x, CROWN_PLACEMENT.z)) {

}

// Blenderで設定された元の値(色・金属度・粗さ)をそのまま尊重し、
// マテリアルクラスだけMeshPhysicalMaterialに上げて環境マップの映り込みを効かせる
function upgradeCrownMaterial(mesh){
  const old = mesh.material;
  mesh.material = new THREE.MeshPhysicalMaterial({
    color: old.color,
    metalness: old.metalness,
    roughness: old.roughness,
    envMapIntensity: 1.0,
  });
  mesh.castShadow = true;
  mesh.receiveShadow = true;
}

function placeCrown(){
  const inner = gltfModelScene2;
  inner.traverse((child) => {
    if (child.isMesh) upgradeCrownMaterial(child);
  });

  const centerX = (CROWN_BOUNDS.min[0] + CROWN_BOUNDS.max[0]) / 2;
  const centerZ = (CROWN_BOUNDS.min[2] + CROWN_BOUNDS.max[2]) / 2;
  const bottomY = CROWN_BOUNDS.min[1];
  inner.position.set(-centerX, -bottomY, -centerZ);

  const wrapper = new THREE.Group();
  wrapper.add(inner);
  wrapper.scale.setScalar(CROWN_SCALE);

  const place = () => {
    const groundY = getTerrainHeightAt(CROWN_PLACEMENT.x, CROWN_PLACEMENT.z);
    wrapper.position.set(CROWN_PLACEMENT.x, groundY, CROWN_PLACEMENT.z);
  };
  if (terrainSample) place(); else pendingOnTerrainReady.push(place);
  wrapper.rotation.y = CROWN_PLACEMENT.rotationY;

  scene.add(wrapper);
}

let gltfModelScene2 = null;
loader.load('./crown.glb', (gltf) => {

/* =========================================================
   レコードオブジェクト設置(複数)+ クリックでレコードルートへ
   ========================================================= */
function buildVinylTexture(label){
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  const cx = size/2, cy = size/2;
  ctx.fillStyle = '#0d0d0f';
  ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  for(let r=size*0.24; r<size*0.49; r+=3){
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.lineWidth = (r % 9 < 2) ? 1.4 : 0.6; ctx.stroke();
  }
  const labelR = size*0.22;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,labelR);
  grad.addColorStop(0, '#f2c14e'); grad.addColorStop(1, '#c98f1f');
  ctx.beginPath(); ctx.arc(cx, cy, labelR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
  ctx.fillStyle = '#241a06'; ctx.textAlign = 'center';
  ctx.font = 'bold 40px Courier New';
  ctx.fillText(label, cx, cy + 12);
  return new THREE.CanvasTexture(cv);
}

// --- 配置データ(位置・動画IDは仮。あとで自由に増減・変更してよい) ---

function createRecord(placement){

// --- クリック判定(ドラッグと区別するため、mousedown→mouseupの移動量をチェック) ---
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  downPos = null;
  if (moved > 6) return; // ドラッグ(視点回転)とみなしクリック扱いしない

  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hit = raycaster.intersectObject(recordDisc)[0];
  if (hit) onRecordClicked();

/* =========================================================
   YouTube連携(postMessage方式。永続レイヤーなのでルート切替の影響を受けない)
   ========================================================= */
const ytIframe = document.getElementById('yt-iframe');
const ytWindow = document.getElementById('yt-window');

function sendYtCommand(func, args = []){
  if (!ytIframe || !ytIframe.contentWindow) return;
  ytIframe.contentWindow.postMessage(JSON.stringify({ event:'command', func, args }), '*');
}
function playYoutube(record){
  ytWindow.classList.add('visible');
  sendYtCommand('loadVideoById', [record.videoId]); // 動画自体を切り替える(loadVideoByIdは読み込み後に自動再生)
  spinningRecordId = record.id;
  if (document.getElementById('record-route').classList.contains('active')) renderJukeboxList();
}

  spinningRecordId = null;

});
window.addEventListener('message', (e) => {
  if (typeof e.data !== 'string') return;
  let data; try { data = JSON.parse(e.data); } catch(err){ return; }
  if (data.event === 'onStateChange' && data.info !== 1) {
    spinningRecordId = null; // 一時停止/終了したら回転も止める
  }
});



const EYE_HEIGHT = 0.05;  // 地面から目線までの高さ(world units) ※建物スケールに対して人間らしい比率にするため、さらに1/10に縮小
const MOVE_SPEED = 0.6;   // units/sec ※目線の縮小に合わせて速度も比例縮小

// --- ジャンプ(月の重力を意識: 地球相当の重力の1/6として計算) ---
const EARTH_LIKE_GRAVITY_REF = 0.55;         // 「地球ならこのくらい」という基準値(仮)
const MOON_GRAVITY = EARTH_LIKE_GRAVITY_REF / 6; // 月は1/6重力 → 同じ初速で6倍高く・6倍長く滞空する
const JUMP_VELOCITY = 0.42;                  // 初速(units/sec)。値を上げるほど高くジャンプする
const JUMP_TIME_SCALE = 1.5;                 // ジャンプの内部時間の進み方を1.5倍速に(高さ・滞空比率は変えず、動きのキビキビ感だけ上げる)
let jumpOffset = 0;
let jumpVelocity = 0;
let isJumping = false;
const keys = {};
let walkMode = false;
const clock = new THREE.Clock();

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyG') toggleWalkMode();
  if (e.code === 'KeyM') toggleMoonOverlay();
  if (e.code === 'Space') {
    e.preventDefault(); // ページスクロールを防止
    if (walkMode && !isJumping) {
      isJumping = true;
      jumpVelocity = JUMP_VELOCITY;
    }
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function toggleWalkMode(){
  walkMode = !walkMode;
  document.getElementById('mode-label').textContent = walkMode ? '地上モード(WASDで移動)' : '俯瞰モード';
  jumpOffset = 0;
  jumpVelocity = 0;
  isJumping = false;
  if (walkMode) {
    // カメラを現在のXZ位置のまま、地面+目線の高さへスナップ
    const groundY = getTerrainHeightAt(camera.position.x, camera.position.z);
    camera.position.y = groundY + EYE_HEIGHT;
    controls.target.copy(camera.position);
    controls.target.z -= 1; // 前方に仮の注視点を置く
    // OrbitControlsを「その場で見回すだけ」の一人称的な挙動にする
    controls.minDistance = 0.01;
    controls.maxDistance = 0.01;
    controls.enablePan = false;
  } else {
    // 俯瞰モードに戻す(通常の距離制限に復帰)
    controls.minDistance = 6;
    controls.maxDistance = 30;
  }
}

function updateWalkMovement(delta){
  if (!walkMode) return;

  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();

  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);

  if (move.lengthSq() > 0){
    move.normalize().multiplyScalar(MOVE_SPEED * delta);
    camera.position.add(move);
  }

  // ジャンプの物理演算(月重力=地球換算の1/6。内部時間を1.5倍速にして動きをキビキビさせる)
  if (isJumping) {
    const jumpDelta = delta * JUMP_TIME_SCALE;
    jumpVelocity -= MOON_GRAVITY * jumpDelta;
    jumpOffset += jumpVelocity * jumpDelta;
    if (jumpOffset <= 0) {
      jumpOffset = 0;
      jumpVelocity = 0;
      isJumping = false;
    }
  }

  // 常に地形の高さ+目線の高さ(+ジャンプ分)にスナップ(地面を歩いているように見せる)
  const groundY = getTerrainHeightAt(camera.position.x, camera.position.z);
  camera.position.y = groundY + EYE_HEIGHT + jumpOffset;

  // 注視点をカメラのすぐ前方に保つ(OrbitControlsを疑似FPS視点として使うためのハック)
  controls.target.copy(camera.position).addScaledVector(forward, 0.01);
}

/* =========================================================
   ループ・リサイズ
   ========================================================= */
function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  updateWalkMovement(delta);
  if (spinningRecordId !== null) recordGroup.rotation.y += delta * 3;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

const MOON_ROTATE_SPEED = 0.006;
const MOON_RETURN_SPEED = 1.1; // 半分にした戻り速度
const moonIdentityQuat = new THREE.Quaternion();

function onMoonPointerDown(e){
  moonIsDragging = true;
  moonReturning = false;
  moonLastPointer = { x:e.clientX, y:e.clientY };
}
function onMoonPointerMove(e){
  updateMoonHoverHighlight(e.clientX, e.clientY);
  if (!moonIsDragging || !moonLastPointer) return;
  const dx = e.clientX - moonLastPointer.x;
  const dy = e.clientY - moonLastPointer.y;
  moonLastPointer = { x:e.clientX, y:e.clientY };
  const yawQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dx*MOON_ROTATE_SPEED);
  const pitchQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), dy*MOON_ROTATE_SPEED);
  moonPivot.quaternion.premultiply(yawQuat).premultiply(pitchQuat);
}
function onMoonPointerUp(){
  if (!moonIsDragging) return;
  moonIsDragging = false;
  moonLastPointer = null;
  moonReturning = true;
}
moonCanvas.addEventListener('pointerdown', onMoonPointerDown);
window.addEventListener('pointermove', onMoonPointerMove);
window.addEventListener('pointerup', onMoonPointerUp);
moonCanvas.addEventListener('pointerleave', () => { moonHoverRing.visible = false; });

const moonRaycaster = new THREE.Raycaster();
const moonPointerNDC = new THREE.Vector2();
function updateMoonHoverHighlight(clientX, clientY){
  if (!moonOverlayEl.classList.contains('active')) return;
  moonPointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  moonPointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  moonRaycaster.setFromCamera(moonPointerNDC, moonCamera);
  const hit = moonRaycaster.intersectObject(moonMesh)[0];
  if (!hit){ moonHoverRing.visible = false; return; }
  const localPoint = moonPivot.worldToLocal(hit.point.clone()).normalize();
  const angle = localPoint.angleTo(MOON_SCHRODINGER_DIR);
  moonHoverRing.visible = angle < MOON_SCHRODINGER_ANGULAR_RADIUS * 1.15;
}

// Mキーでの表示/非表示トグル(表示中だけレンダーループを回す)
let moonOverlayActive = false;
let moonAnimHandle = null;
const moonClock = new THREE.Clock();
function toggleMoonOverlay(){
  moonOverlayActive = !moonOverlayActive;
  moonOverlayEl.classList.toggle('active', moonOverlayActive);
  if (moonOverlayActive){
    moonClock.getDelta(); // 非表示中に経過した時間を捨てる
    moonAnimate();
  } else if (moonAnimHandle){
    cancelAnimationFrame(moonAnimHandle);
    moonAnimHandle = null;
    moonHoverRing.visible = false;
  }
}
function moonAnimate(){
  moonAnimHandle = requestAnimationFrame(moonAnimate);
  const delta = moonClock.getDelta();
  if (moonReturning && !moonIsDragging){
    moonPivot.quaternion.slerp(moonIdentityQuat, Math.min(1, delta * MOON_RETURN_SPEED));
    if (moonPivot.quaternion.angleTo(moonIdentityQuat) < 0.002){
      moonPivot.quaternion.copy(moonIdentityQuat);
      moonReturning = false;
    }
  }
  moonRenderer.render(moonScene, moonCamera);
}

window.addEventListener('resize', () => {
  moonCamera.aspect = window.innerWidth/window.innerHeight;
  moonCamera.updateProjectionMatrix();
  moonRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
